<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 · Signal Lost — Lifelongnerd</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>
    (() => {
      const stored = localStorage.getItem("cp-theme");
      document.documentElement.setAttribute("data-theme", stored || "light");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cp-accent: #b11f4b; --cp-bg: #f4f2ec; --cp-text: #1c2033;
      --cp-muted: #5d6178; --cp-line: rgba(28,32,51,0.20);
      --cp-grid: rgba(28,32,51,0.045);
    }
    [data-theme="dark"] {
      --cp-accent: #dd4d7b; --cp-bg: #12141d; --cp-text: #ece9dd;
      --cp-muted: #9a97a8; --cp-line: rgba(236,233,221,0.20);
      --cp-grid: rgba(236,233,221,0.035);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--cp-bg);
      background-image: linear-gradient(var(--cp-grid) 1px, transparent 1px),
                        linear-gradient(90deg, var(--cp-grid) 1px, transparent 1px);
      background-size: 40px 40px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: var(--cp-text); text-align: center; padding: 24px;
    }
    .glyph { width: 96px; height: 96px; margin: 0 auto 24px; animation: drift 3.2s ease-in-out infinite; }
    @keyframes drift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    h1 {
      font-family: "Big Shoulders Display", sans-serif; font-weight: 800;
      font-size: clamp(3rem, 10vw, 5.5rem); letter-spacing: 0.04em;
      text-transform: uppercase; line-height: 1;
    }
    h1 .accent { color: var(--cp-accent); }
    .code { font-size: 0.8rem; letter-spacing: 0.3em; color: var(--cp-accent); margin: 18px 0 10px; }
    p.msg { font-size: 0.85rem; color: var(--cp-muted); letter-spacing: 0.05em; max-width: 46ch; margin: 0 auto 32px; line-height: 1.7; }
    a.home {
      display: inline-block; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.1em;
      color: var(--cp-bg); background: var(--cp-accent); text-decoration: none;
      padding: 12px 26px; border: 2px solid var(--cp-text);
      box-shadow: 4px 4px 0 var(--cp-text); transition: transform .15s, box-shadow .15s;
    }
    a.home:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--cp-text); }
    @media (prefers-reduced-motion: reduce) { .glyph { animation: none; } }
  </style>
</head>
<body>
  <main>
    <svg class="glyph" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="63" cy="63" r="50" fill="var(--cp-text)"/>
      <circle cx="58" cy="58" r="50" fill="var(--cp-bg)" stroke="var(--cp-text)" stroke-width="3"/>
      <g transform="translate(58,58)">
        <path d="M-9,-24 L-27,0 L-9,24" fill="none" stroke="var(--cp-text)" stroke-width="5.5" stroke-linecap="square"/>
        <path d="M9,-24 L27,0 L9,24" fill="none" stroke="var(--cp-accent)" stroke-width="5.5" stroke-linecap="square"/>
        <circle cx="-9" cy="-24" r="4.5" fill="var(--cp-text)"/><circle cx="9" cy="-24" r="4.5" fill="var(--cp-accent)"/>
        <circle cx="-9" cy="24" r="4.5" fill="var(--cp-text)"/><circle cx="9" cy="24" r="4.5" fill="var(--cp-accent)"/>
        <line x1="-9" y1="-24" x2="-9" y2="-42" stroke="var(--cp-text)" stroke-width="2.5"/>
        <line x1="9" y1="-24" x2="9" y2="-42" stroke="var(--cp-accent)" stroke-width="2.5"/>
        <line x1="-9" y1="24" x2="-9" y2="42" stroke="var(--cp-text)" stroke-width="2.5"/>
        <line x1="9" y1="24" x2="9" y2="42" stroke="var(--cp-accent)" stroke-width="2.5"/>
      </g>
    </svg>
    <h1>Signal <span class="accent">Lost</span></h1>
    <div class="code">// ERROR 404 · NO FIELD NOTES AT THIS FREQUENCY</div>
    <p class="msg">The page you're scanning for doesn't exist out here on the frontier. It may have been moved, renamed, or never dispatched at all.</p>
    <a class="home" href="/">&larr; RETURN TO BASE CAMP</a>
  </main>
</body>
</html>
