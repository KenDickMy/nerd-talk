<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% include glyph.html %}
      <span>
        <span class="brand__name">{{ site.title }}</span>
        <span class="brand__tag">{{ site.tagline }}</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      {% assign current = page.url | remove: 'index.html' %}
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if current == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>

    <a class="icon-btn" href="{{ '/search/' | relative_url }}" aria-label="Search the site"{% if current == '/search/' %} aria-current="page"{% endif %}>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="M16.5 16.5 21 21"/>
      </svg>
    </a>

    <button class="theme-toggle icon-btn" type="button" id="theme-toggle" aria-label="Toggle colour theme">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
      </svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>
      </svg>
    </button>
  </div>
</header>
