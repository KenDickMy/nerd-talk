<footer class="site-footer">
  <div class="wrap">
    <span>&copy; {{ 'now' | date: "%Y" }} {{ site.author }} &middot; {{ site.title }}</span>
    <nav aria-label="Footer">
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="{{ '/archive/' | relative_url }}">Archive</a>
      {% if site.social.github %}<a href="https://github.com/{{ site.social.github }}" rel="me noopener">GitHub</a>{% endif %}
    </nav>
  </div>
</footer>
